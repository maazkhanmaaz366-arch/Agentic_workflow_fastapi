services:
  # Service 1: The MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: backend_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      # Keeps your data safe even if the container is stopped or deleted!
      - mongo_data:/data/db

  # Service 2: Your FastAPI Backend Application
  web:
    build: .
    container_name: backend_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Connects directly to the 'mongodb' container above!
      - MONGO_URL=mongodb://mongodb:27017/
      - DATABASE_NAME=backend_db
      - SECRET_KEY=super_secret_production_key_12345
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_TIME=30
    depends_on:
      - mongodb

volumes:
  mongo_data:
